[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/muidea/modorch-mqtt"

[workspace.dependencies]
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
modorch = { git = "https://github.com/muidea/modorch-rs", rev = "336ba20196044e1b81fb2ca297a18b5e258a5800" }
modorch-mqtt-api = { path = "crates/modorch-mqtt-api", version = "0.1.0-alpha.1" }
modorch-mqtt-core = { path = "crates/modorch-mqtt-core", version = "0.1.0-alpha.1" }
modorch-mqtt = { path = "crates/modorch-mqtt", version = "0.1.0-alpha.1" }
